name: Pump.fun Scan

on:
  workflow_dispatch: {}       # triggered by cron-job.org (and manually, for testing)

permissions:
  contents: write

concurrency:
  group: pumpfun-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests websockets

      - name: Run scan
        env:
          MOBULA_API_KEY: ${{ secrets.MOBULA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MIN_QUALITY_WALLETS: "1"
        run: python alert_bot_github.py

      - name: Save candidate state
        run: |
          git config user.name "pumpfun-scan-bot"
          git config user.email "actions@github.com"

          for i in 1 2 3; do
            git add candidates.json
            git diff --staged --quiet && { echo "No changes to commit."; exit 0; }
            git commit -m "Update candidates [skip ci]"
            if git push; then
              echo "Push succeeded."
              exit 0
            fi

            echo "Push rejected (another run wrote first) -- merging at the JSON level, attempt $i"
            git fetch origin main
            git show origin/main:candidates.json > /tmp/remote_candidates.json || echo '{}' > /tmp/remote_candidates.json
            python3 merge_candidates.py

            git reset --soft origin/main
            git add candidates.json
            git commit -m "Update candidates (merged) [skip ci]"
          done

          echo "Failed to push after retries"
          exit 1
